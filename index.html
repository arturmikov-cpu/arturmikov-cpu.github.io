<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Тест инициализации ВК</title>
</head>
<body>
    <!-- Блок для вывода ошибок на экран -->
    <div id="debug-log" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: red; font-size: 16px; padding: 20px; z-index: 9999; overflow: auto; box-sizing: border-box;">
        Страница загружена. Ожидание VK Bridge...<br>
    </div>

    <!-- Перехватываем любые ошибки JavaScript на странице -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('debug-log').innerHTML += '<br>JS ОШИБКА: ' + msg + '<br>';
        };
    </script>

    <!-- Подключаем VK Bridge с обработчиком ошибки загрузки -->
    <script src="https://cdn.jsdelivr.net/npm/@vk/vk-bridge/dist/browser.min.js" 
            onerror="document.getElementById('debug-log').innerHTML += '<br>ОШИБКА: Скрипт VK Bridge не смог загрузиться! (Блокировка CDN)'">
    </script>

    <script>
        try {
            document.getElementById('debug-log').innerHTML += 'Скрипт подключен. Проверка vkBridge...<br>';
            
            if (typeof vkBridge !== 'undefined') {
                document.getElementById('debug-log').innerHTML += 'vkBridge найден. Отправка VKWebAppInit...<br>';
                
                vkBridge.send('VKWebAppInit')
                    .then(function(data) {
                        document.getElementById('debug-log').innerHTML += '<span style="color:green">УСПЕХ! VKWebAppInit прошел. Приложение должно было загрузиться.</span><br>';
                    })
                    .catch(function(error) {
                        document.getElementById('debug-log').innerHTML += '<br>ОШИБКА ИНИЦИАЛИЗАЦИИ: ' + JSON.stringify(error) + '<br>';
                    });
            } else {
                document.getElementById('debug-log').innerHTML += '<br>ОШИБКА: vkBridge не определен, хотя скрипт загрузился.<br>';
            }
        } catch (e) {
            document.getElementById('debug-log').innerHTML += '<br>КРИТИЧЕСКАЯ ОШИБКА: ' + e.message + '<br>';
        }
    </script>
</body>
</html>
